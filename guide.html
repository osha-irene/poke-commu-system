<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>포켓몬 커뮤니티 — 전체 교체 가이드</title>
<style>
/* ═══════════════════════════════════════════════════════════
   BASE
═══════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#e6edf3;min-height:100vh;display:flex;flex-direction:column}

/* ═══════════════════════════════════════════════════════════
   TOPBAR  (2단 구조)
═══════════════════════════════════════════════════════════ */
.topbar{position:sticky;top:0;z-index:200;background:#161b22;border-bottom:1px solid #30363d}

/* 1단: 카테고리 */
.cat-row{display:flex;align-items:center;gap:0;overflow-x:auto;padding:0 20px;border-bottom:1px solid #21262d}
.cat-row::-webkit-scrollbar{height:0}
.app-title{font-size:11px;font-weight:800;color:#58a6ff;letter-spacing:.1em;white-space:nowrap;padding:10px 16px 10px 0;border-right:1px solid #30363d;margin-right:4px;flex-shrink:0}
.cat-btn{flex-shrink:0;padding:10px 14px;font-size:11px;font-weight:700;color:#8b949e;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;letter-spacing:.04em}
.cat-btn:hover{color:#c9d1d9}
.cat-btn.active{color:#58a6ff;border-bottom-color:#58a6ff}

/* 2단: 서브탭 */
.sub-row{display:flex;align-items:center;gap:0;overflow-x:auto;padding:0 20px;min-height:38px;background:#0d1117}
.sub-row::-webkit-scrollbar{height:0}
.sub-btn{flex-shrink:0;padding:8px 14px;font-size:11px;font-weight:600;color:#6e7681;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.sub-btn:hover{color:#c9d1d9}
.sub-btn.active{color:#f0883e;border-bottom-color:#f0883e}
.sub-row-empty{display:none}

/* ═══════════════════════════════════════════════════════════
   CONTENT
═══════════════════════════════════════════════════════════ */
.content{flex:1;display:flex;overflow:hidden}

/* 왼쪽 프리뷰 패널 */
.preview-panel{width:300px;flex-shrink:0;background:#0d1117;border-right:1px solid #21262d;overflow-y:auto;padding:20px}
.preview-panel::-webkit-scrollbar{width:4px}
.preview-panel::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}

/* 오른쪽 상세 패널 */
.detail-panel{flex:1;overflow-y:auto;padding:24px 28px}
.detail-panel::-webkit-scrollbar{width:4px}
.detail-panel::-webkit-scrollbar-thumb{background:#30363d;border-radius:2px}

/* ═══════════════════════════════════════════════════════════
   SECTION CARDS
═══════════════════════════════════════════════════════════ */
.sec{background:#161b22;border:1px solid #30363d;border-radius:10px;margin-bottom:18px;overflow:hidden}
.sec-head{padding:12px 16px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:8px}
.sec-head h2{font-size:13px;font-weight:700;color:#e6edf3}
.sec-badge{font-size:10px;background:#21262d;color:#8b949e;padding:2px 8px;border-radius:10px;margin-left:auto;white-space:nowrap}
.sec-body{padding:16px}

/* ═══════════════════════════════════════════════════════════
   CODE ELEMENTS
═══════════════════════════════════════════════════════════ */
.ct{background:#0d1117;color:#a5f3fc;padding:2px 6px;border-radius:4px;font-family:'Consolas','Courier New',monospace;font-size:11px;white-space:nowrap}
.cf{background:#161b22;color:#ffa657;padding:2px 6px;border-radius:4px;font-size:11px;white-space:nowrap}
.code-block{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px 16px;font-family:'Consolas','Courier New',monospace;font-size:11px;line-height:1.9;overflow-x:auto;margin-top:8px}
.cc{color:#8b949e}.ck{color:#79c0ff}.cs{color:#a5f3fc}.cn{color:#ff7b72}

/* ═══════════════════════════════════════════════════════════
   TABLE
═══════════════════════════════════════════════════════════ */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;padding:7px 12px;background:#0d1117;color:#8b949e;font-size:10px;font-weight:700;letter-spacing:.07em;border-bottom:1px solid #30363d}
.tbl td{padding:8px 12px;border-bottom:1px solid #1c2128;color:#c9d1d9;vertical-align:middle;line-height:1.5}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:#161b22}

/* ═══════════════════════════════════════════════════════════
   INFO BOXES
═══════════════════════════════════════════════════════════ */
.info{background:#0f2942;border:1px solid #1f6feb;border-radius:8px;padding:12px 14px;font-size:12px;color:#79c0ff;line-height:1.8;margin-bottom:16px}
.info strong{color:#58a6ff}
.warn{background:#2d1f0e;border:1px solid #9e6a03;border-radius:8px;padding:12px 14px;font-size:12px;color:#e3b341;line-height:1.8;margin-bottom:16px}
.warn strong{color:#f0883e}

/* ═══════════════════════════════════════════════════════════
   MOCK COLORS (zone 블록)
═══════════════════════════════════════════════════════════ */
.z{display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:10px;font-weight:700;color:rgba(255,255,255,.92);text-align:center;line-height:1.4;position:relative;overflow:hidden;transition:filter .15s;cursor:default}
.z:hover{filter:brightness(1.15)}
.zl{position:absolute;top:3px;left:4px;font-size:8px;font-weight:800;background:rgba(0,0,0,.6);color:white;padding:1px 4px;border-radius:3px;letter-spacing:.04em}

.za  {background:#1f4068}
.zsb {background:#6366f1}
.zhd {background:#0ea5e9}
.zlo {background:#7c3aed}
.zlc {background:#4c1d95}
.zld {background:#065f46}
.zmn {background:#92400e}
.zmb {background:#9d174d}
.zmh {background:#be123c}
.zbn {background:#7f1d1d}
.zdr {background:#1e3a5f}
.zdh {background:#1d4ed8}
.zmap{background:#16a34a}
.zmbr{background:#84cc16}
.zcmp{background:#14b8a6}
.zcok{background:#fb923c}
.zshp{background:#a78bfa}
.zbat{background:#3b82f6}
.zbat2{background:#ef4444}
.zprof{background:#a855f7}
.zitm{background:#f43f5e}
.zspr{background:#fbbf24}
.zrg {background:#15803d}

/* ═══════════════════════════════════════════════════════════
   LEGEND
═══════════════════════════════════════════════════════════ */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.lg{display:flex;align-items:center;gap:5px;font-size:11px;color:#8b949e;background:#21262d;padding:3px 8px;border-radius:5px}
.lgd{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* ═══════════════════════════════════════════════════════════
   MOCK STRUCTURES
═══════════════════════════════════════════════════════════ */
.app-shell{display:flex;height:340px;border:1px solid #30363d;border-radius:8px;overflow:hidden}
.ms-sb{width:160px;flex-shrink:0;position:relative;display:flex;flex-direction:column}
.ms-main{flex:1;display:flex;flex-direction:column;position:relative}
.ms-hd{height:44px;flex-shrink:0;position:relative;display:flex;align-items:center;padding:0 12px;gap:8px}
.ms-cnt{flex:1;padding:10px;overflow:hidden;position:relative}

.phone{width:190px;height:360px;border:1px solid #30363d;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative;flex-shrink:0}
.ph-hd{height:40px;flex-shrink:0;position:relative;display:flex;align-items:center;padding:0 8px;gap:6px}
.ph-main{flex:1;overflow:hidden;position:relative}
.ph-nav{height:52px;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:space-around}

/* 오버레이 점선 테두리 */
.dash{position:absolute;inset:0;border:2px dashed rgba(255,255,255,.35);border-radius:inherit;pointer-events:none;z-index:5}

/* ═══════════════════════════════════════════════════════════
   두/세 컬럼
═══════════════════════════════════════════════════════════ */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}

/* ═══════════════════════════════════════════════════════════
   오버레이 참고 카드
═══════════════════════════════════════════════════════════ */
.ov-card{background:#1e293b;border-radius:8px;padding:10px}
.ov-swatch{height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-bottom:7px}
.ov-code{font-family:monospace;font-size:10px;color:#a5f3fc}

/* ═══════════════════════════════════════════════════════════
   페이지 뷰 (숨김/표시)
═══════════════════════════════════════════════════════════ */
.view{display:none}
.view.active{display:block}

/* ═══════════════════════════════════════════════════════════
   사이드바 상세 목업 (sidebar-guide)
═══════════════════════════════════════════════════════════ */
.sb-mock{width:220px;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);display:flex;flex-direction:column;position:relative;background:#111827}
.sb-bg-ind{position:absolute;inset:0;border:2px dashed rgba(99,102,241,.5);border-radius:12px;pointer-events:none;z-index:10}
.sb-logo-sec{padding:14px;border-bottom:1px solid #1f2937;background:#1a1f2e;position:relative}
.sb-prof-sec{padding:12px;border-bottom:1px solid #1f2937;background:#131b20;position:relative}
.sb-nav-sec{flex:1;padding:10px;background:#0f172a;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.sb-foot-sec{padding:10px;border-top:1px solid #1f2937;background:#111827;position:relative}
.sb-marker{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:9px;font-weight:900;z-index:20}

.nav-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px}
.nav-row.act{background:#1e2a4a}
.nav-icon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:white;font-size:8px;font-weight:700;flex-shrink:0}
.nav-lbl{height:16px;flex:1;border-radius:4px;display:flex;align-items:center;padding:0 6px;font-size:9px;font-weight:700}

@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════
     TOPBAR
═══════════════════════════════════════════════════════════ -->
<div class="topbar">

  <!-- 카테고리 탭 -->
  <div class="cat-row">
    <div class="app-title">교체 가이드</div>
    <button class="cat-btn active" onclick="selectCat('overview',this)">전체 개요</button>
    <button class="cat-btn" onclick="selectCat('desktop',this)">데스크톱</button>
    <button class="cat-btn" onclick="selectCat('mobile',this)">모바일</button>
    <button class="cat-btn" onclick="selectCat('screens',this)">특수 화면</button>
    <button class="cat-btn" onclick="selectCat('views',this)">뷰 화면</button>
    <button class="cat-btn" onclick="selectCat('howto',this)">사용법</button>
  </div>

  <!-- 서브탭 -->
  <div class="sub-row" id="sub-row"></div>
</div>

<!-- ═══════════════════════════════════════════════════════
     CONTENT
═══════════════════════════════════════════════════════════ -->
<div class="content">

  <!-- 왼쪽: 미니 프리뷰 -->
  <div class="preview-panel" id="preview-panel"></div>

  <!-- 오른쪽: 상세 -->
  <div class="detail-panel" id="detail-panel"></div>
</div>


<script>
/* ═══════════════════════════════════════════════════════════
   데이터 정의
═══════════════════════════════════════════════════════════ */

const CATS = {

  /* ───────────────────────── 전체 개요 ───────────────────────── */
  overview: {
    label: '전체 개요',
    subs: null,
    preview: () => `
      <div style="margin-bottom:12px">
        <div style="font-size:10px;font-weight:700;color:#8b949e;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px">교체 가능 영역</div>
        <div class="legend">
          ${lg('#1f4068','앱 전체')}${lg('#6366f1','사이드바')}${lg('#0ea5e9','헤더')}
          ${lg('#7c3aed','로그인 배경')}${lg('#4c1d95','로그인 카드')}${lg('#065f46','로딩')}
          ${lg('#92400e','점검')}${lg('#9d174d','모바일 전체')}${lg('#be123c','모바일 헤더')}
          ${lg('#7f1d1d','하단 탭바')}${lg('#1e3a5f','드로어 패널')}${lg('#1d4ed8','드로어 헤더')}
        </div>
      </div>
      <!-- 미니 앱 셸 -->
      <div style="font-size:9px;color:#8b949e;margin-bottom:6px;letter-spacing:.06em;font-weight:700;text-transform:uppercase">데스크톱 구조</div>
      <div class="app-shell" style="height:180px">
        <div class="ms-sb zsb" style="position:relative">
          <div class="dash"></div>
          <div style="padding:6px;border-bottom:1px solid rgba(255,255,255,.15)">
            <div class="z" style="height:18px;background:rgba(245,158,11,.85);font-size:8px">로고</div>
          </div>
          <div style="padding:5px;flex:1">
            <div style="font-size:7px;color:rgba(255,255,255,.5);margin-bottom:3px">메뉴</div>
            ${[...Array(4)].map((_,i)=>`<div style="display:flex;gap:3px;align-items:center;padding:3px;${i===0?'background:rgba(255,255,255,.15);border-radius:3px':''}margin-bottom:1px"><div style="width:10px;height:10px;background:rgba(239,68,68,${i===0?.9:.5});border-radius:2px;flex-shrink:0"></div><div style="height:8px;flex:1;background:rgba(255,255,255,${i===0?.2:.1});border-radius:2px"></div></div>`).join('')}
          </div>
        </div>
        <div class="ms-main za" style="position:relative">
          <div class="dash"></div>
          <div class="ms-hd zhd" style="position:relative">
            <div class="dash"></div>
            <div style="font-size:8px;color:white;position:relative;z-index:1">헤더</div>
          </div>
          <div class="ms-cnt" style="display:flex;align-items:center;justify-content:center">
            <div style="font-size:9px;color:rgba(255,255,255,.3);text-align:center">콘텐츠 영역</div>
          </div>
        </div>
      </div>
      <!-- 미니 폰 -->
      <div style="font-size:9px;color:#8b949e;margin:10px 0 6px;letter-spacing:.06em;font-weight:700;text-transform:uppercase">모바일 구조</div>
      <div class="phone" style="height:150px">
        <div style="position:absolute;inset:0" class="zmb"></div>
        <div class="ph-hd zmh" style="position:relative;z-index:1">
          <div style="font-size:8px;color:white">햄버거 | 제목</div>
        </div>
        <div class="ph-main" style="position:relative;z-index:1"></div>
        <div class="ph-nav zbn" style="position:relative;z-index:1">
          ${[...Array(5)].map(()=>`<div style="font-size:7px;color:rgba(255,255,255,.8)">탭</div>`).join('')}
        </div>
      </div>
    `,
    detail: () => `
      <div class="info"><strong>수정 파일:</strong> <span class="ct">src/styles/layout.js</span> 하나만 수정하면 됩니다.<br>
      각 토큰의 <span class="ct">backgroundImage</span> 값을 경로로 바꾸면 즉시 적용됩니다. <span class="ct">null</span>이면 기존 단색/그라디언트 유지.</div>
      <div class="sec">
        <div class="sec-head"><h2>교체 가능한 전체 영역 목록</h2></div>
        <div class="sec-body" style="padding:0">
          <table class="tbl">
            <tr><th>영역</th><th>토큰 (layout.js)</th><th>적용 파일</th><th>오버레이 지원</th></tr>
            ${rows([
              ['앱 전체 배경 (데스크톱)','APP_SHELL.backgroundImage','App.jsx','APP_SHELL.overlayColor'],
              ['사이드바','SIDEBAR.backgroundImage','Sidebar.jsx','SIDEBAR.overlayColor'],
              ['데스크톱 헤더','HEADER.backgroundImage','Header.jsx','HEADER.overlayColor'],
              ['로그인 화면 전체','LOGIN.backgroundImage','LoginScreen.jsx','LOGIN.overlayColor'],
              ['로그인 카드','LOGIN.cardBackgroundImage','LoginScreen.jsx','LOGIN.cardOverlayColor'],
              ['로딩 화면','SCREEN.loading.backgroundImage','LoadingScreen.jsx','SCREEN.loading.overlayColor'],
              ['점검 화면','SCREEN.maintenance.backgroundImage','MaintenanceScreen.jsx','SCREEN.maintenance.overlayColor'],
              ['모바일 전체','MOBILE.backgroundImage','MobileLayout.jsx','MOBILE.overlayColor'],
              ['모바일 상단 헤더','MOBILE.header.backgroundImage','MobileLayout.jsx','MOBILE.header.overlayColor'],
              ['모바일 하단 탭바','MOBILE.bottomNav.backgroundImage','MobileLayout.jsx','MOBILE.bottomNav.overlayColor'],
              ['모바일 드로어 패널','MOBILE.drawer.backgroundImage','MobileLayout.jsx','MOBILE.drawer.overlayColor'],
              ['모바일 드로어 헤더','MOBILE.drawer.headerBackgroundImage','MobileLayout.jsx','MOBILE.drawer.headerOverlayColor'],
            ])}
            <tr><td colspan="4" style="color:#6e7681;font-size:10px;padding:7px 12px">— 이미지 교체 (배경 외) —</td></tr>
            ${rows([
              ['사이드바 로고','SIDEBAR.logo.image','Sidebar.jsx','—'],
              ['기본 아바타','SIDEBAR.profile.defaultAvatar','Sidebar.jsx','—'],
              ['로그인 타이틀','LOGIN.titleImage','LoginScreen.jsx','—'],
              ['로딩 스피너 (gif)','SCREEN.loading.spinnerImage','LoadingScreen.jsx','—'],
              ['점검 아이콘','SCREEN.maintenance.iconImage','MaintenanceScreen.jsx','—'],
              ['메뉴 아이콘 (각 항목)','NAV_ITEMS[n].iconImg','Sidebar.jsx','—'],
              ['메뉴 라벨 (각 항목)','NAV_ITEMS[n].labelImg','Sidebar.jsx','—'],
            ])}
          </table>
        </div>
      </div>
    `
  },

  /* ───────────────────────── 데스크톱 ───────────────────────── */
  desktop: {
    label: '데스크톱',
    subs: ['앱 전체 배경','사이드바','헤더','메뉴 아이콘/라벨'],
    preview: (sub) => {
      const s = sub||'앱 전체 배경'
      return `
        <div style="font-size:9px;color:#8b949e;letter-spacing:.06em;font-weight:700;text-transform:uppercase;margin-bottom:10px">데스크톱 목업</div>
        <div class="app-shell" style="height:260px">
          <div class="ms-sb zsb" style="position:relative;${s==='사이드바'?'outline:2px solid #fff;outline-offset:-2px':''}">
            <div class="dash" style="${s==='사이드바'?'border-color:white':''}" ></div>
            <div style="padding:8px;border-bottom:1px solid rgba(255,255,255,.15)">
              <div class="z" style="height:22px;background:rgba(245,158,11,.85);font-size:8px">로고 이미지</div>
            </div>
            <div style="padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.15)">
              <div style="display:flex;gap:4px;align-items:center">
                <div style="width:24px;height:24px;border-radius:50%;background:rgba(16,185,129,.85);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:7px;color:white">아바타</div>
                <div style="font-size:8px;color:white">이름</div>
              </div>
            </div>
            <div style="padding:5px;flex:1;overflow:hidden">
              ${[...Array(6)].map((_,i)=>`<div style="display:flex;gap:3px;align-items:center;padding:3px 4px;${i===0?'background:rgba(255,255,255,.18);border-radius:4px':''}margin-bottom:2px;${s==='메뉴 아이콘/라벨'?'outline:1px solid rgba(255,200,0,.4);outline-offset:1px;border-radius:4px':''}">
                <div style="width:12px;height:12px;background:rgba(239,68,68,${i===0?.9:.5});border-radius:2px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:6px;color:white">i</div>
                <div style="height:10px;flex:1;background:rgba(249,115,22,${i===0?.7:.3});border-radius:2px;font-size:7px;color:rgba(255,255,255,.8);display:flex;align-items:center;padding:0 4px">라벨</div>
              </div>`).join('')}

/* ═══════════════════════════════════════════════════════════
   헬퍼 함수들
═══════════════════════════════════════════════════════════ */
function lg(color, label) {
  return `<div class="lg"><div class="lgd" style="background:${color}"></div>${label}</div>`
}
function rows(data) {
  return data.map(([a,b,c,d])=>`<tr><td>${a}</td><td><span class="ct">${b}</span></td><td><span class="cf">${c}</span></td><td style="color:#6e7681;font-size:11px">${d}</td></tr>`).join('')
}
function tr(k, v) {
  return `<tr><td><span class="ct">${k}</span></td><td style="color:#c9d1d9">${v}</td></tr>`
}
function detail_simple(title, file, zclass, desc, ...pairs) {
  const rows2 = []
  for(let i=0;i<pairs.length;i+=2) rows2.push(`<tr><td><span class="ct">${pairs[i]}</span></td><td>${pairs[i+1]||''}</td></tr>`)
  return `<div class="sec"><div class="sec-head"><h2>${title}</h2><span class="sec-badge">${file}</span></div><div class="sec-body">
    <div class="z ${zclass}" style="height:64px;margin-bottom:14px">${desc}</div>
    <table class="tbl"><tr><th>토큰</th><th>설명</th></tr>${rows2.join('')}</table>
  </div></div>`
}

/* ═══════════════════════════════════════════════════════════
   상태
═══════════════════════════════════════════════════════════ */
let curCat = 'overview'
let curSub = null

function selectCat(cat, btn) {
  curCat = cat
  curSub = null
  // 카테고리 버튼 활성화
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'))
  btn.classList.add('active')
  renderSubRow()
  render()
}

function selectSub(sub, btn) {
  curSub = sub
  document.querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('active'))
  btn.classList.add('active')
  render()
}

function renderSubRow() {
  const sr = document.getElementById('sub-row')
  const cfg = CATS[curCat]
  if(!cfg.subs || cfg.subs.length===0) {
    sr.innerHTML = ''
    curSub = null
    return
  }
  curSub = cfg.subs[0]
  sr.innerHTML = cfg.subs.map((s,i)=>
    `<button class="sub-btn ${i===0?'active':''}" onclick="selectSub('${s}',this)">${s}</button>`
  ).join('')
}

function render() {
  const cfg = CATS[curCat]
  const sub = curSub

  // 프리뷰
  document.getElementById('preview-panel').innerHTML =
    typeof cfg.preview === 'function' ? cfg.preview(sub) : ''

  // 상세
  document.getElementById('detail-panel').innerHTML =
    typeof cfg.detail === 'function' ? cfg.detail(sub) : ''
}

/* ═══════════════════════════════════════════════════════════
   초기화
═══════════════════════════════════════════════════════════ */
renderSubRow()
render()
</script>
