name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main  # main 브랜치에 푸시할 때 실행
  workflow_dispatch: # 수동 실행 허용

permissions:
  contents: write # gh-pages 브랜치에 푸시할 쓰기 권한 부여

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    env:
      CI: false # React Hook 경고 등을 오류로 취급하지 않음

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      # 1. Node.js 환경 설정
      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          # 프로젝트에 맞는 Node.js 버전을 지정하세요 (예: 20)
          node-version: '20' 

      # 2. 의존성 설치 (sh: react-scripts: not found 오류 해결)
      - name: Install Dependencies
        # package-lock.json을 사용해 더 빠르고 안정적으로 설치
        run: npm ci 

      # 3. 프로젝트 빌드
      - name: Build Project
        run: npm run build
        
      # 4. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # GitHub Actions 기본 토큰 사용 (contents: write 권한 필요)
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # react-scripts 빌드 결과 폴더 지정
          publish_dir: ./build
          # 배포 후 원본 커밋 메시지를 사용하도록 설정
          commit_message: Deploy site from GitHub Actions