name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main  # main 브랜치에 푸시할 때 실행
  workflow_dispatch: # 수동 실행 허용

permissions:
  contents: write
  id-token: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    env:
      CI: false # React Hook 경고 등을 오류로 취급하지 않음

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      # 1. Node.js 환경 설정
      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      # 2. 의존성 설치
      - name: Install Dependencies
        run: npm ci 

      # 3. 프로젝트 빌드 (⭐ 환경 변수 추가!)
      - name: Build Project
        env:
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
          REACT_APP_FIREBASE_DATABASE_URL: ${{ secrets.REACT_APP_FIREBASE_DATABASE_URL }}
          REACT_APP_MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          REACT_APP_MASTODON_BOT_BATTLE: ${{ secrets.MASTODON_BOT_BATTLE }}
          REACT_APP_MASTODON_TOKEN_BATTLE: ${{ secrets.MASTODON_TOKEN_BATTLE }}
          REACT_APP_MASTODON_BOT_TRADE: ${{ secrets.MASTODON_BOT_TRADE }}
          REACT_APP_MASTODON_TOKEN_TRADE: ${{ secrets.MASTODON_TOKEN_TRADE }}
          REACT_APP_MASTODON_BOT_NOTIFY: ${{ secrets.MASTODON_BOT_NOTIFY }}
          REACT_APP_MASTODON_TOKEN_NOTIFY: ${{ secrets.MASTODON_TOKEN_NOTIFY }}
          REACT_APP_MASTODON_BOT_CAMP: ${{ secrets.MASTODON_BOT_CAMP }}
          REACT_APP_MASTODON_TOKEN_CAMP: ${{ secrets.MASTODON_TOKEN_CAMP }}
        run: npm run build
        
      # 4. Firebase Storage CORS 설정
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set Firebase Storage CORS
        uses: google-github-actions/setup-gcloud@v2

      - name: Apply CORS to Firebase Storage
        run: gsutil cors set cors.json gs://poke-commu-system.firebasestorage.app

      # 5. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          commit_message: Deploy site from GitHub Actions
